<!doctype html>
<html lang="ko" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수노로 만들고, 배포하고, 수익화까지 — 당근모임 실전 가이드</title>
<meta name="description" content="당근모임에서 시작된 수노(Suno) AI 음악 실전 가이드. 곡을 만드는 법부터 유통, 스트리밍 발매, 저작권, 수익화까지 한 권으로 정리했습니다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sidebar-bg:#14161f;
  --sidebar-fg:#e9e7df;
  --sidebar-muted:#8d8fa0;
  --sidebar-border:#262837;
  --sidebar-card:#1b1e2a;
  --accent:#ff7a30;
  --accent-ink:#3a1a02;
  --font-serif:'Noto Serif KR', Georgia, 'Nanum Myeongjo', serif;
  --font-sans:'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  --step:0;
  --content-bg:#f7f1e3;
  --content-fg:#2b2620;
  --content-muted:#71695a;
  --content-card:#efe6d2;
  --content-border:#e0d5ba;
  color-scheme: light;
}
:root[data-theme="white"]{
  --content-bg:#ffffff; --content-fg:#1c1c1e; --content-muted:#6b6b70;
  --content-card:#f4f4f6; --content-border:#e4e4e8;
}
:root[data-theme="dark"]{
  --content-bg:#15161b; --content-fg:#e9e8e3; --content-muted:#9b9a94;
  --content-card:#1e1f26; --content-border:#2c2d36; color-scheme: dark;
}
:root[data-theme="navy"]{
  --content-bg:#0d1b2a; --content-fg:#e7eef5; --content-muted:#93a7bb;
  --content-card:#122841; --content-border:#1c3a57; color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans);
  background:var(--content-bg);
  color:var(--content-fg);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%;}
[hidden]{display:none!important;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

.app{display:flex; min-height:100vh; width:100%;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:330px; flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-fg);
  padding:26px 22px 18px; display:flex; flex-direction:column; gap:16px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid var(--sidebar-border);
  transition:transform .25s ease;
  z-index:40;
}
.badge{
  display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:11px;
  letter-spacing:.08em; padding:5px 10px; border-radius:999px; text-transform:uppercase;
}
.book-title{font-family:var(--font-serif); font-size:22px; line-height:1.35; margin:2px 0 0; font-weight:700;}
.book-title em{color:var(--accent); font-style:normal;}
.book-sub{font-size:12.5px; color:var(--sidebar-muted); margin:2px 0 8px; letter-spacing:.02em;}
.hr{height:1px; background:var(--sidebar-border); border:0; margin:2px 0 4px;}

.tabs{display:flex; gap:8px;}
.tab-btn{
  flex:1; border:1px solid var(--sidebar-border); background:transparent; color:var(--sidebar-muted);
  padding:9px 8px; border-radius:8px; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px;
}
.tab-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

.toc-search{
  width:100%; background:var(--sidebar-card); border:1px solid var(--sidebar-border); color:var(--sidebar-fg);
  border-radius:8px; padding:9px 10px; font-size:12.5px; outline:none;
}
.toc-search::placeholder{color:var(--sidebar-muted);}

.toc-scroll{flex:1; overflow-y:auto; margin:0 -6px; padding:0 6px;}
.part-block{margin-bottom:14px;}
.part-head{
  display:flex; justify-content:space-between; align-items:baseline; color:var(--accent);
  font-size:12.5px; font-weight:700; letter-spacing:.02em; padding:6px 4px 6px;
}
.part-head span.n{color:var(--sidebar-muted); font-weight:600;}
.ch-item{
  width:100%; text-align:left; background:transparent; border:0; color:var(--sidebar-fg);
  padding:8px 10px; border-radius:8px; font-size:13px; line-height:1.4; display:flex; gap:8px; align-items:flex-start;
}
.ch-item:hover{background:var(--sidebar-card);}
.ch-item.active{background:var(--sidebar-card); color:#fff; box-shadow:inset 3px 0 0 var(--accent);}
.ch-num{color:var(--sidebar-muted); font-variant-numeric:tabular-nums; font-size:11.5px; padding-top:1px; flex-shrink:0; width:24px;}
.ch-item.active .ch-num{color:var(--accent);}
.ch-check{margin-left:auto; flex-shrink:0; color:var(--accent); font-size:12px; padding-top:1px;}

.progress-wrap{border-top:1px solid var(--sidebar-border); padding-top:14px; margin-top:auto;}
.progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--sidebar-muted); margin-bottom:6px;}
.progress-label b{color:var(--accent);}
.progress-bar{height:6px; border-radius:999px; background:var(--sidebar-card); overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); width:0%; transition:width .3s ease;}
.cta-btn{
  display:block; text-align:center; margin-top:12px; background:var(--accent); color:var(--accent-ink);
  font-weight:700; font-size:13.5px; padding:11px; border-radius:9px; text-decoration:none;
}
.cta-sub{font-size:11px; color:var(--sidebar-muted); text-align:center; margin-top:6px;}

.sidebar-close{display:none;}

/* ---------- Reader ---------- */
.reader{flex:1; min-width:0; display:flex; flex-direction:column;}
.reader-header{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:14px clamp(18px,4vw,48px); border-bottom:1px solid var(--content-border);
  background:color-mix(in srgb, var(--content-bg) 92%, transparent); backdrop-filter:blur(6px);
}
.menu-btn{display:none; border:1px solid var(--content-border); background:transparent; color:var(--content-fg); width:34px; height:34px; border-radius:8px; align-items:center; justify-content:center;}
.crumb{font-size:13px; color:var(--content-muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.crumb b{color:var(--content-fg); font-weight:700;}
.tool-group{display:flex; align-items:center; gap:4px;}
.theme-dot{
  width:22px; height:22px; border-radius:50%; border:2px solid var(--content-border); padding:0; flex-shrink:0;
}
.theme-dot[data-t="paper"]{background:#f7f1e3;}
.theme-dot[data-t="white"]{background:#ffffff;}
.theme-dot[data-t="dark"]{background:#15161b;}
.theme-dot[data-t="navy"]{background:#0d1b2a;}
.theme-dot.active{border-color:var(--accent);}
.font-group{display:flex; align-items:center; gap:2px; border-left:1px solid var(--content-border); margin-left:6px; padding-left:8px;}
.font-btn{background:transparent; border:1px solid var(--content-border); color:var(--content-fg); border-radius:7px; padding:5px 8px; font-size:11.5px; font-weight:700;}
.font-btn.active{border-color:var(--accent); color:var(--accent);}

.content-scroll{flex:1; overflow-y:auto;}
.content{
  max-width:720px; margin:0 auto; padding:48px clamp(18px,4vw,48px) 20px;
  font-size:calc(16px + var(--step) * 1.5px);
}
.content .kicker{font-size:.8em; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:700; margin:0 0 10px;}
.content h1{font-family:var(--font-serif); font-size:1.95em; line-height:1.35; margin:0 0 26px;}
.content p{line-height:1.9; margin:0 0 20px; color:var(--content-fg);}
.content p.lead{font-size:1.07em; color:var(--content-fg);}
.content blockquote{
  margin:28px 0; padding:18px 22px; background:var(--content-card); border-left:4px solid var(--accent);
  border-radius:4px; font-family:var(--font-serif); font-size:1.05em; line-height:1.8;
}
.content ul, .content ol{line-height:1.9; margin:0 0 20px; padding-left:1.3em;}
.content li{margin-bottom:8px;}
.content strong{color:var(--accent); font-weight:700;}
.content table{width:100%; border-collapse:collapse; margin:8px 0 24px; font-size:.92em;}
.content th,.content td{border:1px solid var(--content-border); padding:10px 12px; text-align:left; line-height:1.6;}
.content th{background:var(--content-card); font-weight:700;}
.checklist{list-style:none; padding:0; margin:0 0 24px;}
.checklist li{
  display:flex; gap:10px; align-items:flex-start; background:var(--content-card); border:1px solid var(--content-border);
  border-radius:10px; padding:12px 14px; margin-bottom:10px; line-height:1.7;
}
.checklist li::before{content:"☐"; color:var(--accent); font-size:1.1em; flex-shrink:0;}

.reader-footer{
  border-top:1px solid var(--content-border); padding:18px clamp(18px,4vw,48px) calc(24px + env(safe-area-inset-bottom,0px));
  display:flex; justify-content:space-between; gap:12px;
}
.nav-btn{
  border:1px solid var(--content-border); background:var(--content-card); color:var(--content-fg);
  padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:600; max-width:48%;
  display:flex; flex-direction:column; gap:2px;
}
.nav-btn.next{margin-left:auto; text-align:right; align-items:flex-end;}
.nav-btn small{color:var(--content-muted); font-weight:500; font-size:11px;}
.nav-btn:disabled{opacity:.35; pointer-events:none;}

@media (max-width:900px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); width:min(86vw,340px); box-shadow:0 0 40px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{display:block; margin-left:auto; background:transparent; border:0; color:var(--sidebar-muted); font-size:20px;}
  .menu-btn{display:flex;}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; opacity:0; pointer-events:none; transition:opacity .2s;}
  .scrim.show{opacity:1; pointer-events:auto;}
  .tool-group.theme-group{display:none;}
}
@media (max-width:520px){
  .content{padding-top:32px;}
  .content h1{font-size:1.6em;}
}
</style>
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div style="display:flex;align-items:flex-start;">
      <span class="badge">🥕 당근모임 MUSIC LAB</span>
      <button class="sidebar-close" id="sidebarClose" aria-label="닫기">✕</button>
    </div>
    <h1 class="book-title">수노로 만들고<br><em>배포하고, 수익화까지</em></h1>
    <p class="book-sub">당근모임에서 시작된 AI 음악 실전 가이드</p>
    <p class="book-sub" style="margin-top:-4px;">🔄 마지막 업데이트 2026.09 · Suno v6 반영</p>
    <hr class="hr">
    <div class="tabs">
      <button class="tab-btn active" data-tab="toc">📖 본문 목차</button>
      <button class="tab-btn" data-tab="appendix">🛠 부록</button>
    </div>
    <input class="toc-search" id="tocSearch" placeholder="목차 검색 (예: 저작권, 프롬프트)">
    <div class="toc-scroll" id="tocScroll"></div>
    <div class="progress-wrap">
      <div class="progress-label"><span>완독률</span><b id="progressPct">0%</b></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <a class="cta-btn" href="https://suno01.vercel.app" target="_blank" rel="noopener">당근모임 참가 신청하기 →</a>
      <p class="cta-sub">부산 연제구 · 수노 자동화 &amp; 프로듀싱 정기모임</p>
    </div>
  </aside>

  <main class="reader">
    <header class="reader-header">
      <button class="menu-btn" id="menuBtn" aria-label="목차 열기">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="tool-group theme-group">
        <button class="theme-dot active" data-t="paper" title="페이퍼 웜"></button>
        <button class="theme-dot" data-t="white" title="클래식 화이트"></button>
        <button class="theme-dot" data-t="dark" title="미드나잇 다크"></button>
        <button class="theme-dot" data-t="navy" title="로열 네이비"></button>
      </div>
      <div class="font-group">
        <button class="font-btn" data-step="-1">가-</button>
        <button class="font-btn active" data-step="0">가</button>
        <button class="font-btn" data-step="1">가+</button>
        <button class="font-btn" data-step="2">가++</button>
      </div>
    </header>
    <div class="content-scroll">
      <article class="content" id="content"></article>
      <footer class="reader-footer">
        <button class="nav-btn prev" id="prevBtn"><small>← 이전 꼭지</small><span id="prevLabel"></span></button>
        <button class="nav-btn next" id="nextBtn"><small>다음 꼭지로 →</small><span id="nextLabel"></span></button>
      </footer>
    </div>
  </main>
</div>

<script>
const PARTS = [
  {id:0, label:"책머리에"},
  {id:1, label:"1부 · 수노로 음악 만들기"},
  {id:2, label:"2부 · 완성한 곡을 세상에 내놓기"},
  {id:3, label:"3부 · 수익화 설계"},
  {id:4, label:"맺음말"},
];

const CH = [
{id:"00", part:0, title:"이 책을 여는 이유", html:`
<p class="kicker">머리말</p>
<h1>이 책을 여는 이유</h1>
<p class="lead">당근모임은 부산 연제구의 작은 정기모임에서 시작됐습니다. 참가비도, 강사료도 없이 각자 노트북을 들고 모여 수노(Suno)로 곡을 만들어보던 자리였습니다.</p>
<p>처음 몇 번은 다들 신이 나 있었습니다. 프롬프트 몇 줄로 그럴듯한 곡 하나가 뚝딱 나오는 경험은 누구에게나 짜릿합니다. 그런데 세 번째, 네 번째 모임이 지나면서 같은 질문이 반복됐습니다. "곡은 만들었는데, 이걸 어떻게 사람들한테 들려주죠?" "이거 팔아도 되는 건가요?" "수익화된다는 광고를 봤는데 진짜예요?"</p>
<p>이 책은 그 질문들에 대한 모임의 답을 정리한 기록입니다. 화려한 성공 스크린샷이나 "한 달 만에 얼마 벌었다"는 식의 이야기는 담지 않았습니다. 대신 곡을 만드는 절차, 세상에 내놓는 절차, 돈이 들어오는 구조를 있는 그대로 적었습니다.</p>
<blockquote>비법은 없습니다. 있는 것은 절차와, 그 절차를 끝까지 해본 사람들의 기록뿐입니다.</blockquote>
<p>당근모임이라는 이름을 그대로 부제에 쓴 이유도 여기에 있습니다. 이 책은 특정 강의를 팔기 위한 자료가 아니라, 실제로 만나서 곡을 만들고 발매까지 해본 사람들이 같이 정리한 가이드입니다.</p>
`},
{id:"01", part:0, title:"당근모임에서 시작된 질문", html:`
<p class="kicker">도입 사례</p>
<h1>당근모임에서 시작된 질문</h1>
<p class="lead">8월 모임에서 한 참가자가 완성한 로파이 트랙을 재생했을 때, 방 안의 반응은 딱 두 가지로 갈렸습니다. "오, 진짜 노래 같다"는 감탄과, "근데 이거 어디에 써요?"라는 질문.</p>
<p>당근모임 참가자 대부분은 음악을 전공하지 않았습니다. 자영업자, 직장인, 대학생, 콘텐츠를 만드는 1인 크리에이터까지 다양합니다. 공통점은 하나였습니다. 곡을 "만드는 것"까지는 도구 덕분에 쉬웠지만, 그다음 단계에서 전부 막힌다는 것이었습니다.</p>
<ul>
<li>완성한 곡을 유튜브에 올렸다가 저작권 경고를 받은 사람</li>
<li>스트리밍에 발매하고 싶은데 어느 유통사를 골라야 할지 몰라 반년째 미루는 사람</li>
<li>"수노로 월 수익 700만원" 같은 광고를 보고 결제 직전까지 갔다가 손을 멈춘 사람</li>
</ul>
<p>이 책은 그 막힘을 순서대로 풀어갑니다. 1부는 곡을 제대로 만드는 법, 2부는 그 곡을 세상에 내놓는 법, 3부는 거기서 돈이 어떻게, 얼마나, 어떤 조건에서 들어오는지를 다룹니다. 마지막 부록은 모임에서 실제로 쓰는 점검표와 체크리스트를 그대로 옮겨 놓았습니다.</p>
`},
{id:"02", part:1, title:"수노란 무엇인가", html:`
<h1>수노란 무엇인가</h1>
<p class="lead">수노(Suno)는 텍스트 프롬프트만으로 작곡, 작사, 보컬, 편곡까지 한 번에 만들어주는 AI 음악 생성 서비스입니다. 악기를 다룰 줄 몰라도, 코드를 몰라도 곡 한 곡이 2~3분 안에 나옵니다.</p>
<p>생성 방식은 크게 두 가지입니다. <strong>심플 모드</strong>는 원하는 분위기와 주제를 한두 문장으로 적으면 가사부터 멜로디까지 AI가 알아서 채워줍니다. 입문자에게 적합합니다. <strong>커스텀 모드</strong>는 가사, 스타일 태그, 곡 구조([Verse], [Chorus] 같은 섹션 표시), 곡 제목까지 직접 입력할 수 있어 의도한 결과물에 훨씬 가깝게 다가갈 수 있습니다.</p>
<p>요금제는 무료 플랜과 유료 플랜(프로/프리미어 등급)으로 나뉘며, 매달 지급되는 크레딧 안에서 생성 횟수가 정해집니다. 중요한 것은 <strong>상업적 이용 권한은 무료 플랜에는 주어지지 않는다</strong>는 점입니다. 곡을 팔거나 수익화할 계획이 있다면 이 부분을 가장 먼저 확인해야 합니다. 자세한 권한 구조는 8장에서 다룹니다.</p>
<p>당근모임에서는 첫 시간을 늘 이 설명에 씁니다. 도구를 화려하게 쓰는 법보다, 도구가 무엇을 해주고 무엇을 해주지 않는지를 먼저 아는 것이 훨씬 중요하기 때문입니다.</p>
<blockquote>2026년 9월 9일, 수노는 <strong>v6 모델군</strong>을 출시했습니다. 이 책의 본문은 v6를 기준으로 씁니다. v6는 지금까지와 달리 워너뮤직·BMG·빌리브 같은 권리사와 라이선스 계약을 맺고 학습한 첫 세대 모델이라는 점에서, 단순한 성능 업그레이드를 넘어 수노라는 서비스 자체의 방향이 바뀐 사건입니다. 자세한 배경은 부록 E를 확인하세요.</blockquote>
<table>
<tr><th>모델</th><th>특징</th><th>이용 가능 플랜</th></tr>
<tr><td>v6</td><td>플래그십 모델. 안정적이고 정교하며 모든 장르에서 고르게 다듬어진 결과물</td><td>Pro, Premier</td></tr>
<tr><td>v6-wild</td><td>실험적 모델. 더 예측 불가능하고 개성 강한 결과물을 원할 때</td><td>Pro, Premier</td></tr>
<tr><td>v6-mini</td><td>더 빠르고 가벼운 버전. 무료 플랜 사용자도 바로 쓸 수 있음</td><td>Free, Pro, Premier</td></tr>
</table>
<p>기능 면에서도 달라진 점이 많습니다. 자연어만으로 곡의 특정 구간을 다시 쓰는 <strong>섹션 편집</strong>, 서로 다른 생성곡에서 보컬과 드럼을 따로 가져와 합치는 <strong>매시업</strong>, 프롬프트 한 줄로 비트만 따로 뽑아내는 정밀 샘플링, 오디오·이미지·영상까지 참고해 곡을 만드는 <strong>멀티모달 생성</strong>이 세 모델 모두에 공통으로 적용됩니다. 생성 속도도 빨라져 프롬프트를 쓰고 몇 초 안에 결과를 들을 수 있고, 세 모델 모두 최대 8분 길이까지 한 번에 생성됩니다.</p>
`},
{id:"03", part:1, title:"좋은 프롬프트의 구조", html:`
<h1>좋은 프롬프트의 구조</h1>
<p class="lead">"신나는 노래 만들어줘"라고만 입력하면 결과물은 매번 크게 달라집니다. 좋은 프롬프트는 운에 맡기지 않고, AI가 판단할 여지를 줄여주는 프롬프트입니다.</p>
<p>당근모임에서 쓰는 기본 구조는 다섯 가지 요소로 이루어져 있습니다.</p>
<ul>
<li><strong>장르</strong> — city pop, lo-fi hip hop, K-ballad 처럼 구체적으로</li>
<li><strong>무드</strong> — nostalgic, warm, driving, melancholic 등 감정 단어</li>
<li><strong>악기 편성</strong> — 어떤 악기가 중심이 되는지 (전자피아노, 어쿠스틱 기타 등)</li>
<li><strong>보컬 특징</strong> — 성별, 톤, 창법(breathy female vocal, powerful male belt 등)</li>
<li><strong>템포/에너지</strong> — 느린 발라드인지, 업템포 댄스인지</li>
</ul>
<p>예시: <em>"90s city pop, nostalgic and warm, electric piano and fretless bass, breathy female vocal, mid-tempo"</em> 같은 식으로 다섯 요소를 이어 붙이면, 매번 비슷한 방향의 결과물이 나옵니다.</p>
<blockquote>프롬프트는 정답을 맞히는 게 아니라, 실패의 범위를 좁히는 작업입니다.</blockquote>
<p>한 번에 완벽한 결과를 기대하기보다, 같은 프롬프트에서 두세 개 버전을 뽑아 비교하는 습관을 들이는 것이 훨씬 효율적입니다. 이 방법은 6장에서 이어서 다룹니다.</p>
`},
{id:"04", part:1, title:"스타일 태그와 장르 조합", html:`
<h1>스타일 태그와 장르 조합</h1>
<p class="lead">수노는 스타일 태그를 쉼표로 나열하는 방식을 지원합니다. 태그 하나하나가 곡의 색깔을 결정하는 다이얼이라고 생각하면 이해가 쉽습니다.</p>
<p>당근모임에서 참가자들이 가장 많이 하는 실수는 태그를 너무 많이 넣는 것입니다. 여덟, 아홉 개씩 상충하는 태그를 나열하면(예: "aggressive trap"과 "gentle lullaby"를 동시에) AI는 둘 사이에서 타협하다가 애매한 결과물을 냅니다. 태그는 <strong>3~6개 사이</strong>로, 서로 방향이 맞는 것들로 구성하는 편이 안정적입니다.</p>
<table>
<tr><th>목적</th><th>추천 태그 조합 예시</th></tr>
<tr><td>카페/작업용 배경음악</td><td>lo-fi, chillhop, mellow, vinyl crackle, instrumental</td></tr>
<tr><td>숏폼 브이로그 배경</td><td>indie pop, upbeat, acoustic guitar, female vocal, bright</td></tr>
<tr><td>광고/브랜드 로고송</td><td>corporate, uplifting, piano, clean vocal, short intro</td></tr>
<tr><td>동네 행사 오프닝</td><td>marching brass, festive, energetic, crowd-friendly</td></tr>
</table>
<p>장르를 조합할 때는 "베이스 장르 하나 + 무드 태그 두세 개" 순서로 접근하면 실패가 줄어듭니다. 여러 장르를 억지로 섞기보다, 하나의 장르 안에서 디테일을 쌓아가는 편이 곡의 완성도를 높입니다.</p>
`},
{id:"05", part:1, title:"커스텀 모드로 곡 완성하기", html:`
<h1>커스텀 모드로 곡 완성하기</h1>
<p class="lead">진짜 "내 곡"에 가까운 결과물을 원한다면 커스텀 모드로 넘어가야 합니다. 가사를 직접 쓰고, 곡의 구조를 섹션 태그로 지정할 수 있기 때문입니다.</p>
<p>가사 입력창에는 <code>[Intro]</code>, <code>[Verse 1]</code>, <code>[Pre-Chorus]</code>, <code>[Chorus]</code>, <code>[Bridge]</code>, <code>[Outro]</code> 같은 구조 태그를 줄마다 넣어줍니다. 이 태그가 곡의 뼈대가 되어, AI가 후렴에서는 후렴다운 멜로디를, 브릿지에서는 분위기를 바꾸는 전개를 넣어줍니다. 태그 없이 가사만 쭉 나열하면 곡이 밋밋하게 흘러가는 경우가 많습니다.</p>
<p>당근모임에서 반응이 좋았던 기능은 <strong>Persona(페르소나)</strong>입니다. 마음에 든 보컬 톤을 저장해두고 이후 다른 곡에서도 같은 목소리로 이어 쓸 수 있어, 모임에서 만든 여러 곡을 하나의 "가상 아티스트" 앨범처럼 묶는 데 활용하고 있습니다.</p>
<blockquote>구조 태그를 쓰는 것과 안 쓰는 것의 차이는, 스케치와 완성작의 차이만큼 큽니다.</blockquote>
<p>가사를 직접 쓰기 부담스럽다면, 심플 모드로 먼저 초안을 뽑은 뒤 마음에 드는 소절만 남기고 나머지를 다시 쓰는 방식도 당근모임에서 자주 쓰는 절충안입니다.</p>
`},
{id:"06", part:1, title:"반복 생성과 트랙 큐레이션", html:`
<h1>반복 생성과 트랙 큐레이션</h1>
<p class="lead">수노로 만든 첫 결과물을 그대로 발매하는 사람은 거의 없습니다. 좋은 곡은 대개 열 번쯤 다시 뽑아본 뒤에 나온 세 번째나 일곱 번째 버전입니다.</p>
<p>같은 프롬프트로 <strong>Extend(확장)</strong> 기능을 쓰면 마음에 드는 구간 이후를 이어서 생성할 수 있고, <strong>Remix</strong> 기능을 쓰면 완성된 곡의 장르나 보컬만 바꿔 다른 버전을 만들 수 있습니다. 당근모임에서는 한 프롬프트당 최소 4개 버전을 뽑고, 그중 도입부가 가장 좋은 버전과 후렴이 가장 좋은 버전을 기준으로 다시 태그를 조정하는 방식을 씁니다.</p>
<ul>
<li>1차: 같은 프롬프트로 4곡 생성 → 전체 구조가 좋은 것 고르기</li>
<li>2차: 고른 곡 기준으로 태그 미세 조정 → 4곡 재생성</li>
<li>3차: 최종 후보 2곡을 모임 채팅방에 올려 다른 참가자 의견 듣기</li>
</ul>
<p>혼자 판단하면 놓치기 쉬운 어색한 발음이나 반복되는 멜로디 패턴을, 다른 사람의 귀로 한 번 더 걸러내는 것이 당근모임 큐레이션 과정의 핵심입니다.</p>
<p>여기까지가 "손으로 한 곡씩" 만드는 방법입니다. 후보를 한 번에 열 개, 스무 개씩 기획하고 싶다면 다음 장에서 다루는 Gemini Notebook 활용법을 참고하세요.</p>
`},
{id:"07", part:1, title:"Gemini Notebook으로 제목·가사·스타일 프롬프트 뽑아내기", html:`
<h1>Gemini Notebook으로 제목·가사·스타일 프롬프트 뽑아내기</h1>
<p class="lead">수노 앞에 앉기 전에 이미 절반은 끝나 있어야 합니다. 당근모임에서는 곡을 만들기 전 기획 단계를 Gemini Notebook(구 NotebookLM)에 맡깁니다. 원하는 방향을 소스로 정리해두면, 그 방향 안에서 제목·가사·스타일 프롬프트 후보를 한 번에 열 개, 스무 개씩 뽑아낼 수 있습니다.</p>
<p>Gemini Notebook은 업로드한 소스 안에서만 답하는 도구입니다. 이 "소스 안에서만"이라는 제약이 오히려 장점이 됩니다. 아무 근거 없이 그럴듯한 말을 지어내는 대신, 내가 넣어준 레퍼런스를 기반으로 방향이 일관된 결과를 뽑아주기 때문입니다.</p>

<h1 style="font-size:1.3em; margin-top:36px;">1단계 · 원하는 방향을 소스로 정리하기</h1>
<p>새 노트북을 만들고, 만들고 싶은 곡의 방향을 보여줄 수 있는 자료를 소스로 넣습니다. 좋아하는 가수의 인터뷰 기사, 참고하고 싶은 가게·행사 소개 글, 이전에 써둔 가사 메모 등 무엇이든 괜찮습니다. 소스가 구체적일수록 다음 단계에서 나오는 제목과 가사도 구체적입니다.</p>

<h1 style="font-size:1.3em; margin-top:36px;">2단계 · NotebookLM Web Importer로 유튜브 레퍼런스 가져오기</h1>
<p>텍스트 자료만으로는 "이런 느낌"을 전달하기 어려울 때가 많습니다. 이럴 때 <a href="https://chromewebstore.google.com/detail/notebooklm-web-importer-a/pnnlnelknnpdljlkabehdmiapniffdlo" target="_blank" rel="noopener">NotebookLM Web Importer</a> 크롬 확장 프로그램을 씁니다. 웹페이지나 유튜브 영상을 클릭 한 번으로 Gemini Notebook 소스에 바로 추가해주는 도구입니다.</p>
<ul class="checklist">
<li>크롬 웹스토어에서 NotebookLM Web Importer를 설치하고, 사용 중인 구글 계정으로 로그인한다</li>
<li>참고하고 싶은 유튜브 영상(레퍼런스 곡, 무드 보드 영상, 비슷한 컨셉의 브이로그 등)을 재생 중인 탭에서 확장 프로그램 아이콘을 클릭한다</li>
<li>가져올 Gemini Notebook 노트북을 선택하면, 영상의 자막·설명 등이 소스로 자동 추가된다</li>
<li>영상 여러 개를 한 번에 가져오고 싶다면, 탭을 여러 개 열어두거나 재생목록 링크를 넣어 한꺼번에 불러온다</li>
</ul>
<blockquote>레퍼런스 영상은 "분위기와 구조"를 참고하는 용도입니다. 다음 단계에서 나오는 가사가 원곡 가사를 그대로 베끼지 않았는지는 항상 사람이 직접 확인하세요. AI가 소스를 요약하다가 원문 표현을 그대로 가져오는 경우가 있습니다.</blockquote>

<h1 style="font-size:1.3em; margin-top:36px;">3단계 · 제목·가사·스타일 프롬프트 최대한 많이 뽑아내기</h1>
<p>소스가 쌓였다면, 채팅창에 원하는 방향과 개수를 구체적으로 요청합니다. 예시:</p>
<blockquote>"방금 넣은 소스들의 분위기를 참고해서, [원하는 장르/무드]에 맞는 곡 제목 10개, 각 제목에 어울리는 수노 스타일 프롬프트(장르·무드·악기·보컬·템포 포함), 그리고 후렴 한 줄씩을 표로 정리해줘"</p>
<p>한 번에 마음에 드는 결과가 안 나와도 괜찮습니다. "더 밝은 느낌으로 5개 더", "3번 방향으로 제목만 다르게 5개 더"처럼 이어서 요청하면 같은 방향 안에서 후보가 계속 늘어납니다. 이렇게 모은 후보를 표 형태로 쌓아두는 것이 다음 단계의 핵심입니다.</p>
<table>
<tr><th>번호</th><th>제목(안)</th><th>스타일 프롬프트</th><th>후렴 한 줄</th></tr>
<tr><td>1</td><td>여름밤 라디오</td><td>city pop, nostalgic, electric piano, breathy female vocal, mid-tempo</td><td>...</td></tr>
<tr><td>2</td><td>퇴근길 신호등</td><td>lo-fi hip hop, mellow, vinyl crackle, instrumental</td><td>...</td></tr>
</table>

<h1 style="font-size:1.3em; margin-top:36px;">4단계 · 엑셀 파일로 자동 정리하기</h1>
<p>Gemini Notebook은 채팅 결과나 리포트(Report) 형태의 답변을 PDF·워드·엑셀(.xlsx)·파워포인트로 바로 내보낼 수 있습니다. 표로 정리해달라고 요청한 결과물은 특히 엑셀로 내보냈을 때 그대로 표 형식이 유지됩니다.</p>
<ul class="checklist">
<li>3단계에서 뽑은 표를 "지금까지 나온 후보를 전부 표로 정리한 리포트로 만들어줘"처럼 요청해 하나의 리포트로 합친다</li>
<li>리포트 화면의 내보내기(Export) 메뉴에서 엑셀(.xlsx)을 선택해 다운로드한다 — 표가 있는 리포트는 구글 시트로 바로 보내는 것도 가능하다</li>
<li>내려받은 엑셀에 "선정 여부", "생성일", "발매 상태" 같은 열을 직접 추가해, 당근모임 카탈로그 관리 표로 확장해서 쓴다</li>
</ul>
<p>이렇게 만든 엑셀 한 장이 곧 여러분의 "곡 파이프라인"입니다. 제목과 스타일 프롬프트 열을 그대로 복사해 수노 커스텀 모드에 붙여넣으면, 기획 단계에서 만든 방향을 그대로 이어받아 곡을 생성할 수 있습니다.</p>

<h1 style="font-size:1.3em; margin-top:36px;">5단계 · 수노로 넘기기</h1>
<p>엑셀에서 마음에 드는 후보를 고르고, 3장의 프롬프트 구조(장르·무드·악기·보컬·템포)에 맞게 다듬어 수노에 그대로 입력합니다. 여러 후보를 미리 표로 쌓아둔 덕분에, 한 곡이 마음에 안 들어도 바로 다음 후보로 넘어갈 수 있어 6장의 반복 생성 과정이 훨씬 빨라집니다.</p>
`},
{id:"08", part:2, title:"저작권과 이용권, 무엇이 내 것인가", html:`
<h1>저작권과 이용권, 무엇이 내 것인가</h1>
<p class="lead">발매 이야기를 꺼내기 전에 반드시 짚어야 하는 것이 이용권입니다. "내가 만들었으니 내 곡"이라는 생각으로 바로 유통에 넘겼다가 되돌리는 사례를 당근모임에서 여러 번 봤습니다.</p>
<p>수노의 이용약관은 요금제에 따라 상업적 이용 가능 여부가 갈립니다. 일반적으로 무료 플랜으로 만든 곡은 비상업적 용도로만 쓸 수 있고, 유료 플랜(프로 이상)으로 만든 곡부터 상업적 이용과 소유권 관련 권한이 부여됩니다. <strong>요금제와 약관은 서비스 정책에 따라 계속 바뀌므로, 발매 직전 반드시 수노 공식 이용약관의 최신 조항을 직접 확인해야 합니다.</strong> 이 책의 설명은 구조를 이해하기 위한 안내일 뿐, 법적 확정 문구가 아닙니다.</p>
<blockquote>약관은 캡처해두는 것이 아니라, 발매할 때마다 다시 읽는 것입니다.</blockquote>
<p>2026년 9월 기준으로 정리하면 아래와 같습니다.</p>
<table>
<tr><th>플랜</th><th>월 요금</th><th>상업적 이용</th><th>비고</th></tr>
<tr><td>Free</td><td>$0</td><td>불가 (영구 비상업)</td><td>이후 유료로 업그레이드해도 무료 플랜 때 만든 곡은 비상업 상태 그대로 유지됩니다</td></tr>
<tr><td>Pro</td><td>$10 (연간 결제 시 $8)</td><td>가능</td><td>구독 중 만든 곡에 한해 상업적 이용·배포·수익화 가능, 수익 100% 아티스트 귀속</td></tr>
<tr><td>Premier</td><td>$30 (연간 결제 시 $24)</td><td>가능</td><td>Pro와 동일한 상업 권한 + 다운로드 한도가 가장 넉넉함(부록 E)</td></tr>
</table>
<p>또 한 가지, 구독이 끊기면 이전에 만든 곡의 상업적 이용권도 함께 사라지는 경우가 있습니다. 발매해서 오래 수익을 낼 계획이라면 구독 상태를 유지할지, 이용권이 영구적으로 남는 방식인지 반드시 확인하고 판단해야 합니다. 당근모임에서는 발매 전 이 항목을 부록 B 체크리스트의 첫 줄에 넣어두었습니다.</p>
<blockquote>2026년 9월 출시된 v6는 워너뮤직·BMG·빌리브와 라이선스 계약을 맺고 학습한 첫 모델입니다. 그만큼 저작권 구조가 예전보다 투명해졌다는 신호이지만, 유니버설뮤직·소니뮤직 등과의 소송은 여전히 진행 중입니다. 즉 "이제 저작권 문제가 다 해결됐다"고 단정할 단계는 아니라는 뜻입니다. 발매·수익화처럼 되돌리기 어려운 결정을 내리기 전에는 그 시점의 수노 공식 이용약관을 다시 확인하는 습관이 여전히 필요합니다.</blockquote>
`},
{id:"09", part:2, title:"유통사 고르기", html:`
<h1>유통사 고르기</h1>
<p class="lead">멜론, 지니, 스포티파이 같은 스트리밍 플랫폼에는 개인이 직접 곡을 업로드할 수 없습니다. 음원 유통사를 거쳐야 합니다. 유통사는 여러분의 파일과 메타데이터를 받아 각 플랫폼에 등록해주는 대행사입니다.</p>
<table>
<tr><th>비교 기준</th><th>확인할 점</th></tr>
<tr><td>수수료 구조</td><td>정률(매출의 일정 %)인지, 연간 정액제인지</td></tr>
<tr><td>정산 주기</td><td>월 정산인지, 분기 정산인지</td></tr>
<tr><td>AI 생성곡 허용 여부</td><td>일부 유통사는 AI 생성 음원 업로드에 별도 확인 절차를 둡니다</td></tr>
<tr><td>국내 플랫폼 커버리지</td><td>멜론·지니·벅스 같은 국내 플랫폼까지 포함하는지</td></tr>
<tr><td>발매 소요 기간</td><td>보통 영업일 기준 5~14일 정도 여유를 둡니다</td></tr>
</table>
<p>당근모임에서는 특정 유통사를 강요하지 않습니다. 대신 신청 전 위 다섯 가지를 반드시 비교 대조하고, 계약서(이용약관)에서 <strong>저작권 귀속 조항</strong>과 <strong>해지 시 카탈로그 처리 방식</strong> 두 가지를 눈으로 직접 확인하고 진행하라고 안내합니다.</p>
<p>처음 발매한다면 곡 1~2개만 먼저 올려보고, 정산이 실제로 들어오는 구조와 대시보드 사용법을 익힌 뒤 카탈로그를 늘려가는 방식을 권합니다.</p>
`},
{id:"10", part:2, title:"커버아트·메타데이터·ISRC 준비", html:`
<h1>커버아트·메타데이터·ISRC 준비</h1>
<p class="lead">곡이 아무리 좋아도 메타데이터가 어긋나면 플랫폼 심사에서 반려되거나, 최악의 경우 발매 후 다른 곡과 뒤섞여 정산이 잘못 집계될 수 있습니다.</p>
<ul>
<li><strong>커버아트</strong> — 정사각형, 최소 3000×3000px, 텍스트 과다·타 브랜드 로고 사용 금지</li>
<li><strong>곡 제목/아티스트명</strong> — 특수문자, 이모지, 전부 대문자 표기는 플랫폼별로 반려 사유가 될 수 있음</li>
<li><strong>ISRC 코드</strong> — 곡을 식별하는 국제 고유번호. 보통 유통사가 자동 발급해주지만, 직접 발급 여부도 확인</li>
<li><strong>UPC/EAN</strong> — 앨범(발매 단위)을 식별하는 바코드 번호, ISRC와 마찬가지로 유통사가 대개 자동 부여</li>
<li><strong>발매일</strong> — 플레이리스트 피칭을 노린다면 실제 발매일보다 최소 2~3주 전에 신청 완료</li>
</ul>
<p>당근모임에서는 아트워크를 만들 때도 저작권 문제를 짚습니다. 무료 이미지 생성 도구로 만든 커버라도 상업적 이용 조건을 다시 확인해야 하고, 특정 브랜드나 유명인의 이미지를 연상시키는 이미지는 피해야 합니다.</p>
<p>서두르지 않는 것이 핵심입니다. 메타데이터 오류로 반려되면 재심사에 다시 며칠이 걸리고, 계획했던 발매일을 놓치는 경우가 가장 흔한 실수입니다.</p>
<blockquote>2026년 9월 3일부터 수노에 <strong>다운로드 횟수 제한</strong>이 생겼습니다(Free 평생 7회, Pro 월 20회, Premier 월 60회). 발매용 원본 WAV 파일은 곡을 완성한 그 자리에서 바로 다운로드해 따로 보관해두세요. 나중에 유통사 신청 단계에서 다시 받으려다 한도가 소진돼 있으면 발매 일정이 밀릴 수 있습니다. 자세한 내용은 부록 E를 확인하세요.</blockquote>
`},
{id:"11", part:2, title:"스트리밍 플랫폼에 발매하기", html:`
<h1>스트리밍 플랫폼에 발매하기</h1>
<p class="lead">유통사를 통해 곡을 등록하면 보통 한 번의 신청으로 스포티파이, 애플뮤직, 유튜브뮤직, 멜론, 지니, 벅스 등 주요 플랫폼에 동시 발매됩니다. 개별로 하나씩 올릴 필요는 없습니다.</p>
<p>발매 자체보다 중요한 것은 발매 이후입니다. 당근모임에서 강조하는 세 가지 체크포인트가 있습니다.</p>
<ul>
<li><strong>아티스트 프로필 인증</strong> — 스포티파이 포 아티스트(Spotify for Artists), 유튜브뮤직 아티스트 채널 등록을 통해 프로필 사진, 소개글, SNS 링크를 채워야 청취자가 "진짜 활동하는 아티스트"로 인식합니다</li>
<li><strong>플레이리스트 피칭</strong> — 발매 전 사전 제출 기능(스포티파이 등)을 활용해 에디토리얼 플레이리스트 노출 기회를 노려볼 수 있습니다</li>
<li><strong>발매 직후 3일</strong> — 초기 스트림 수가 알고리즘 추천 여부에 영향을 주는 경우가 많아, 당근모임 참가자들끼리 발매 소식을 SNS와 당근모임 채널에 함께 공유합니다</li>
</ul>
<blockquote>발매는 결승선이 아니라 출발선입니다. 대부분의 수익은 발매 이후의 꾸준한 노출에서 만들어집니다.</blockquote>
`},
{id:"12", part:2, title:"유튜브·쇼츠·틱톡에 배포하기", html:`
<h1>유튜브·쇼츠·틱톡에 배포하기</h1>
<p class="lead">스트리밍 정산만으로는 초반 수익을 체감하기 어렵습니다. 당근모임에서는 완성한 곡을 숏폼 콘텐츠로 먼저 배포해 반응을 확인하는 방법을 함께 씁니다.</p>
<p>전체 곡에서 가장 인상적인 15~30초 구간(대개 후렴)을 잘라 세로형 영상으로 만들고, 유튜브 쇼츠·인스타그램 릴스·틱톡에 동시에 올리는 방식입니다. 자막이나 가사 텍스트를 함께 넣으면 소리를 끄고 보는 시청자에게도 곡이 전달됩니다.</p>
<ul>
<li>유튜브 롱폼에는 가사와 함께 곡 전체를 올리고, 설명란에 스트리밍 링크를 모아둡니다(링크트리 등 활용)</li>
<li>숏폼 클립은 매주 1~2개씩, 같은 곡을 다른 구간으로 반복 배포해 "어느 구간이 반응이 좋은지" 데이터를 쌓습니다</li>
<li>다른 채널이 여러분의 곡을 배경음악으로 썼을 때 알림이 오도록, 유튜브 콘텐츠ID 등록을 해두면 좋습니다(14장 참고)</li>
</ul>
<p>숏폼은 수익 자체보다 <strong>발견 경로</strong>를 늘리는 역할이 큽니다. 스트리밍 정산은 더디게 쌓이지만, 숏폼에서 발견된 청취자가 그 곡을 찾아 플레이리스트에 저장하면서 장기적인 스트림으로 이어지는 흐름을 당근모임에서도 여러 번 확인했습니다.</p>
`},
{id:"13", part:3, title:"스트리밍 정산은 어떻게 들어오는가", html:`
<h1>스트리밍 정산은 어떻게 들어오는가</h1>
<p class="lead">"스트리밍 1회당 얼마"라는 고정 단가는 존재하지 않습니다. 플랫폼마다, 국가마다, 그리고 그달 전체 스트리밍 총량에 따라 정산 단가 자체가 매달 달라지기 때문입니다.</p>
<p>대략적인 구조는 이렇습니다. 플랫폼 구독료·광고 매출이 모여 정산 재원(pro-rata pool)을 이루고, 그달 전체 스트림 수 대비 내 곡이 차지한 스트림 비율만큼 나눠 받습니다. 여기서 <strong>유통사 수수료</strong>가 먼저 빠지고 나머지가 아티스트 몫으로 들어옵니다.</p>
<table>
<tr><th>단계</th><th>내용</th></tr>
<tr><td>1. 스트리밍 발생</td><td>청취자가 30초 이상 재생하면 유효 스트림으로 집계(플랫폼별 기준 상이)</td></tr>
<tr><td>2. 플랫폼 정산</td><td>다음 달 또는 다음 분기, 유통사로 정산 데이터 전달</td></tr>
<tr><td>3. 유통사 정산</td><td>수수료 차감 후 아티스트 계정으로 입금(보통 월 단위 또는 최소 지급액 도달 시)</td></tr>
</table>
<p>당근모임에서는 곡 하나로 큰돈을 기대하기보다, <strong>여러 곡을 꾸준히 쌓아 카탈로그를 만드는 것</strong>이 스트리밍 수익 구조에 훨씬 맞는 전략이라고 안내합니다. 한 곡의 대박보다 열 곡의 꾸준함이 안정적인 수익으로 이어집니다.</p>
`},
{id:"14", part:3, title:"유튜브 애드센스와 콘텐츠ID", html:`
<h1>유튜브 애드센스와 콘텐츠ID</h1>
<p class="lead">유튜브에서 발생하는 음악 수익은 두 갈래입니다. 여러분이 직접 올린 영상의 광고 수익, 그리고 다른 사람이 여러분의 곡을 배경음악으로 썼을 때 발생하는 콘텐츠ID 수익입니다.</p>
<p>직접 올린 영상은 유튜브 파트너 프로그램(구독자·시청시간 기준 충족 시) 가입 후 애드센스로 광고 수익을 정산받습니다. 반면 <strong>콘텐츠ID</strong>는 유통사를 통해 내 곡의 음원 지문을 유튜브에 등록해두면, 다른 채널이 그 곡을 배경음악 등으로 사용했을 때 자동으로 탐지되어 그 영상의 광고 수익 일부를 나눠 받는 방식입니다.</p>
<ul>
<li>콘텐츠ID 등록은 보통 유통사의 부가 서비스로 신청(모든 유통사가 지원하는 것은 아니므로 9장에서 비교할 때 함께 확인)</li>
<li>등록 후에는 "매칭 정책"을 직접 설정할 수 있습니다 — 수익화(광고 붙이고 수익 공유), 추적만, 차단 중 선택 가능</li>
<li>초반에는 수익화보다 "추적"으로 설정해 내 곡이 얼마나, 어디서 쓰이는지 데이터를 먼저 모아보는 것도 방법입니다</li>
</ul>
<p>당근모임 참가자 중 한 명은 배경음악용으로 만든 로파이 트랙이 여러 브이로그 채널에서 반복적으로 쓰이며 콘텐츠ID로만 꾸준한 소액 수익을 만들어낸 사례가 있습니다. 화제성보다 "쓰기 좋은 곡"이 오래가는 수익을 만든다는 것을 보여준 사례였습니다.</p>
`},
{id:"15", part:3, title:"사운드 라이선싱과 싱크 수익", html:`
<h1>사운드 라이선싱과 싱크 수익</h1>
<p class="lead">스트리밍 정산 외에 또 하나의 수익 경로는 라이선싱입니다. 광고, 유튜브 콘텐츠, 소상공인 매장 배경음악, 지역 행사 등에 곡 사용권을 판매하는 방식입니다.</p>
<ul>
<li><strong>스톡뮤직 플랫폼 등록</strong> — 곡을 업로드해두면 크리에이터가 구독료를 내고 라이선스를 구매할 때마다 수익이 발생하는 구조. 플랫폼별 상업적 AI 생성곡 허용 정책을 먼저 확인해야 합니다</li>
<li><strong>다이렉트 싱크(sync) 계약</strong> — 광고대행사, 영상 제작사, 지역 소상공인과 직접 협의해 특정 용도로만 곡을 대여하는 방식. 계약서에 사용 기간·매체·지역 범위를 명확히 적어야 분쟁을 줄일 수 있습니다</li>
<li><strong>로열티프리 단건 판매</strong> — 곡 하나를 정액에 판매하고 이후 추가 정산 없이 종결하는 방식. 초기 수익화에는 가장 단순하지만 장기 수익은 포기하는 구조입니다</li>
</ul>
<blockquote>라이선싱은 "누가 얼마나 오래 쓸 수 있는가"를 문서로 남기는 일입니다. 구두 약속은 라이선스가 아닙니다.</blockquote>
<p>당근모임에서는 라이선싱 계약 전, 최소한 사용 매체·기간·지역·재판매 가능 여부 네 가지를 담은 간단한 계약서 양식을 부록 C와 함께 공유하고 있습니다.</p>
`},
{id:"16", part:3, title:"당근모임에서 협업하고 판매하기", html:`
<h1>당근모임에서 협업하고 판매하기</h1>
<p class="lead">가장 현실적인 첫 수익화 경로는 사실 거창한 플랫폼이 아니라, 동네 안에 있습니다. 당근모임이 "당근"이라는 이름을 쓰는 이유이기도 합니다.</p>
<p>로컬 소상공인은 매장 배경음악, 개업 축하 로고송, SNS 홍보 영상 브금 같은 짧은 음악 수요가 꾸준히 있지만, 예산이 크지 않아 전문 스튜디오에 맡기기는 부담스러워합니다. 당근모임 참가자들은 이 틈새를 실전 포트폴리오이자 소득으로 연결하고 있습니다.</p>
<ul>
<li><strong>매장 로고송</strong> — 가게 이름과 분위기를 담은 15~30초 짧은 곡, 개업 이벤트나 SNS 오프닝에 사용</li>
<li><strong>동네 행사 배경음악</strong> — 지역 축제, 프리마켓, 소모임 홍보 영상용 배경음악 패키지</li>
<li><strong>모임 내 공동 작업</strong> — 작사에 강한 사람, 프롬프트 튜닝에 강한 사람, 홍보 영상 편집에 강한 사람이 역할을 나눠 하나의 프로젝트를 완성하고 수익을 지분대로 나누는 방식</li>
</ul>
<p>실제 얼굴을 아는 사람들과의 거래이기 때문에, 온라인 플랫폼보다 신뢰를 쌓기 쉽고 분쟁도 적습니다. 다만 금액이 작더라도 반드시 사용 범위와 대금을 문자나 간단한 계약서로 남겨두라고 안내합니다. 아는 사이일수록 나중에 말이 달라지는 경우가 생기기 때문입니다.</p>
`},
{id:"17", part:3, title:"흔한 실패 사례에서 배우기", html:`
<h1>흔한 실패 사례에서 배우기</h1>
<p class="lead">당근모임이 몇 차례 모임을 거치며 모은 것은 성공담만이 아닙니다. 오히려 반복되는 실패 유형을 아는 것이 다음 시행착오를 줄여줍니다.</p>
<ul>
<li><strong>무료 플랜으로 만든 곡을 상업적으로 유통</strong> — 나중에 이용권 문제로 발매를 내려야 했던 사례. 8장의 이용권 확인은 발매 전 첫 단계입니다</li>
<li><strong>한 곡에 올인</strong> — 완성도에 집착해 몇 달을 한 곡에만 쏟다가 지쳐서 그만둔 사례. 여러 곡을 꾸준히 만드는 쪽이 확률적으로도, 심리적으로도 유리합니다</li>
<li><strong>"수노로 월 수천만원" 강의 결제</strong> — 검증되지 않은 수익 인증 화면만 보고 고가의 강의를 결제했다가, 강의 내용이 이 책에 무료로 정리된 절차와 크게 다르지 않았던 사례. 화면 속 숫자는 누구나 편집할 수 있다는 사실을 기억해야 합니다</li>
<li><strong>메타데이터 부실로 발매 반려 반복</strong> — 10장의 체크리스트를 건너뛰고 서둘러 신청했다가 발매일을 두 번 놓친 사례</li>
</ul>
<blockquote>실패의 대부분은 재능 부족이 아니라, 순서를 건너뛴 결과였습니다.</blockquote>
<p>이 책의 부록은 바로 이 실패들을 다시 반복하지 않기 위해 만든 점검표입니다. 화려한 지름길을 약속하는 대신, 건너뛰기 쉬운 단계를 눈앞에 미리 세워두는 것이 이 책이 할 수 있는 최선이라고 생각했습니다.</p>
`},
{id:"18", part:4, title:"다음 트랙을 향해", html:`
<p class="kicker">맺음말</p>
<h1>다음 트랙을 향해</h1>
<p class="lead">여기까지 읽으셨다면, 곡 하나를 만들고 세상에 내놓고 정산을 받기까지의 전체 그림을 한 바퀴 도신 셈입니다.</p>
<p>이 책이 드리고 싶었던 것은 화려한 성공 공식이 아니라, 각 단계에서 무엇을 확인하고 무엇을 건너뛰면 안 되는지를 아는 감각이었습니다. 그 감각은 책 한 권으로 완성되지 않습니다. 실제로 프롬프트를 몇 번 다시 써보고, 발매 신청서를 한 번 채워보고, 첫 정산 메일을 받아봐야 몸에 남습니다.</p>
<p>당근모임은 그 과정을 혼자 하지 않도록 만든 자리입니다. 부산 연제구에서 정기적으로 모여 서로의 곡을 들려주고, 발매 경험을 나누고, 막힌 부분을 함께 풀어갑니다. 온라인 강의가 줄 수 없는 것 — 같은 자리에서 같은 문제를 겪는 사람과의 대화 — 을 당근모임은 목표로 하고 있습니다.</p>
<blockquote>완벽한 첫 곡은 없습니다. 다만 완성된 다음 트랙은 늘 있습니다.</blockquote>
<p>부록에는 지금 바로 쓸 수 있는 점검표와 양식을 정리해두었습니다. 이 책을 덮고 나서, 결제 버튼 대신 프롬프트 입력창을 먼저 열어보시길 바랍니다.</p>
`},
];

<p>세 모델 모두 공통으로 다음 기능을 지원합니다.</p>

{id:"F", title:"Gemini Notebook으로 곡 준비하고 Flow Music으로 완성하기", html:`
<p class="kicker">부록 F · 구글 도구 활용</p>
<h1>Gemini Notebook으로 곡 준비하고 Flow Music으로 완성하기</h1>
<p class="lead">당근모임에는 "수노 말고 구글 걸로도 만들 수 있나요?"라는 질문이 종종 나옵니다. 결론부터 말하면 가능하지만, 도구 하나가 아니라 <strong>두 도구를 이어 쓰는 방식</strong>입니다. 이 부록은 그 기초 과정을 정리합니다.</p>
<blockquote>먼저 헷갈리기 쉬운 것부터 정리합니다. <strong>Gemini Notebook</strong>(2026년 7월 NotebookLM에서 이름이 바뀐 서비스)은 노래를 작곡해주는 도구가 아닙니다. 문서·자료를 넣으면 AI가 읽고 정리해주는 리서치 노트 도구이고, 오디오 기능(Audio Overview)도 사람 목소리 두 명이 대화하는 <strong>팟캐스트 형식</strong>(Deep Dive·Brief·Critique·Debate·Lecture)이지 작곡이 아닙니다. 구글 생태계에서 실제로 곡을 만들어주는 도구는 <strong>Flow Music</strong>(flowmusic.app, Lyria 3 Pro 엔진)입니다.</blockquote>

<h1 style="font-size:1.3em; margin-top:36px;">1단계 · Gemini Notebook에서 곡 준비하기</h1>
<p>Gemini Notebook은 "작곡"이 아니라 "기획"을 돕는 역할로 씁니다.</p>
<ul class="checklist">
<li>새 노트북을 만들고, 가사 아이디어 메모·분위기 레퍼런스 글·행사나 가게 소개 텍스트 등을 소스로 업로드한다</li>
<li>채팅으로 "이 자료를 바탕으로 곡의 컨셉, 분위기, 가사 초안을 정리해줘"처럼 요청한다 — 업로드한 소스에 근거해 정리해준다</li>
<li>Audio Overview(Brief 형식 추천)로 짧게 요약 음성을 만들어 들으며 아이디어가 말이 되는지 점검한다 — 이 음성은 노래가 아니라 대화형 요약이라는 점을 다시 기억한다</li>
<li>정리된 내용을 "장르 + 무드 + 악기 + 보컬 + 템포" 형태(3장 프롬프트 구조와 동일)로 다듬어, 다음 단계에서 쓸 프롬프트 문장으로 완성한다</li>
</ul>

<h1 style="font-size:1.3em; margin-top:36px;">2단계 · Flow Music에서 실제로 곡 만들기</h1>
<ul class="checklist">
<li>flowmusic.app에 접속해 개인 Gmail 계정으로 로그인한다 (워크스페이스·학교 계정은 사용 불가, 결제 없이 무료 크레딧으로 시작 가능)</li>
<li>"Create Song"을 눌러 1단계에서 정리한 프롬프트를 자연어로 입력한다 — 장르·무드·템포·악기를 구체적으로 쓸수록 결과가 안정적이다</li>
<li>생성 후 우측 상단 "Compose"에서 Lyrics(가사)·Sound(사운드)·Details(세부사항)를 개별 조정해 재생성할 수 있다</li>
<li>Replace(특정 구간만 교체)·Extend(특정 구간 이후를 이어서 생성)로 다듬는다 — 원본은 항상 보존되는 비파괴 편집 방식이다</li>
<li>완성되면 최대 3분 길이(인트로·벌스·코러스·브릿지 구조, 48kHz 스테레오)의 곡을 받는다</li>
</ul>
<p>편집할 때는 한 번에 한두 가지만 지시하는 편이, 의도한 변화가 맞는지 확인하기 쉽습니다.</p>

<h1 style="font-size:1.3em; margin-top:36px;">수노와 비교하면</h1>
<table>
<tr><th>기준</th><th>수노(Suno)</th><th>Flow Music(Lyria 3 Pro)</th></tr>
<tr><td>최대 길이</td><td>모델에 따라 더 김 (v6 최대 8분)</td><td>최대 3분</td></tr>
<tr><td>로그인</td><td>수노 계정</td><td>개인 Gmail 계정</td></tr>
<tr><td>기획 보조 도구</td><td>없음 (직접 프롬프트 작성)</td><td>Gemini Notebook과 조합 가능</td></tr>
<tr><td>영상 연계</td><td>없음</td><td>Veo와 연계한 뮤직비디오 생성 지원</td></tr>
</table>
<p>이 책의 본문은 수노를 기준으로 쓰였지만, 당근모임에서는 Flow Music도 함께 실험하고 있습니다. 두 도구 모두 이 책 2부·3부의 발매·저작권·수익화 원칙(자신의 계정으로 만든 곡인지, 상업적 이용 조건이 무엇인지 확인하는 것)은 동일하게 적용됩니다. 도구가 하나 늘었다고 확인 절차를 건너뛰지 마세요.</p>
`},
];

const SECTIONS = [...CH.map(c=>({...c, group:'main'})), ...APX.map(a=>({...a, group:'appendix', part:null}))];

const state = {
  tab: 'toc',
  currentId: CH[0].id,
  theme: localStorage.getItem('smTheme') || 'paper',
  step: parseInt(localStorage.getItem('smStep') || '0', 10),
  visited: new Set(JSON.parse(localStorage.getItem('smVisited') || '[]')),
  query: ''
};

const el = {
  sidebar: document.getElementById('sidebar'),
  scrim: document.getElementById('scrim'),
  tocScroll: document.getElementById('tocScroll'),
  tocSearch: document.getElementById('tocSearch'),
  content: document.getElementById('content'),
  crumb: document.getElementById('crumb'),
  progressPct: document.getElementById('progressPct'),
  progressFill: document.getElementById('progressFill'),
  prevBtn: document.getElementById('prevBtn'),
  nextBtn: document.getElementById('nextBtn'),
  prevLabel: document.getElementById('prevLabel'),
  nextLabel: document.getElementById('nextLabel'),
};

function findSection(id){ return SECTIONS.find(s=>s.id===id); }

function renderTOC(){
  el.tocScroll.innerHTML = '';
  const q = state.query.trim().toLowerCase();
  if(state.tab === 'toc'){
    PARTS.forEach(part=>{
      const chapters = CH.filter(c=>c.part===part.id && (!q || c.title.toLowerCase().includes(q)));
      if(!chapters.length) return;
      const block = document.createElement('div');
      block.className = 'part-block';
      const head = document.createElement('div');
      head.className = 'part-head';
      head.innerHTML = `<span>${part.label}</span><span class="n">${chapters.length}개 꼭지</span>`;
      block.appendChild(head);
      chapters.forEach(c=>block.appendChild(chapterButton(c)));
      el.tocScroll.appendChild(block);
    });
  } else {
    const block = document.createElement('div');
    block.className = 'part-block';
    const head = document.createElement('div');
    head.className = 'part-head';
    head.innerHTML = `<span>부록</span><span class="n">${APX.length}개</span>`;
    block.appendChild(head);
    APX.filter(a=>!q || a.title.toLowerCase().includes(q)).forEach(a=>block.appendChild(chapterButton(a, true)));
    el.tocScroll.appendChild(block);
  }
}

function chapterButton(c, isAppendix){
  const btn = document.createElement('button');
  btn.className = 'ch-item' + (c.id===state.currentId ? ' active' : '');
  const visited = state.visited.has(c.id);
  btn.innerHTML = `<span class="ch-num">${isAppendix ? c.id : (c.id+'장')}</span><span>${c.title}</span>${visited ? '<span class="ch-check">✓</span>' : ''}`;
  btn.addEventListener('click', ()=>{
    state.currentId = c.id;
    closeSidebarMobile();
    render();
  });
  return btn;
}

function updateProgress(){
  const pct = Math.round((state.visited.size / CH.length) * 100);
  el.progressPct.textContent = pct + '%';
  el.progressFill.style.width = pct + '%';
}

function renderContent(){
  const sec = findSection(state.currentId);
  el.content.innerHTML = sec.html;
  const partLabel = sec.group==='main' ? PARTS.find(p=>p.id===sec.part).label : '부록';
  el.crumb.innerHTML = `<b>${sec.group==='main' ? sec.id+'장' : '부록 '+sec.id}</b> · ${partLabel} · ${sec.title}`;
  if(sec.group==='main'){
    state.visited.add(sec.id);
    localStorage.setItem('smVisited', JSON.stringify([...state.visited]));
  }
  updateProgress();
  document.querySelector('.content-scroll').scrollTo({top:0, behavior:'instant' in document.documentElement.style ? 'instant' : 'auto'});

  const idx = SECTIONS.findIndex(s=>s.id===state.currentId && s.group===sec.group);
  const prev = SECTIONS[idx-1];
  const next = SECTIONS[idx+1];
  el.prevBtn.disabled = !prev;
  el.nextBtn.disabled = !next;
  el.prevLabel.textContent = prev ? prev.title : '';
  el.nextLabel.textContent = next ? next.title : '';
  el.prevBtn.onclick = ()=>{ if(prev){ state.currentId = prev.id; state.tab = prev.group==='main' ? 'toc':'appendix'; render(); } };
  el.nextBtn.onclick = ()=>{ if(next){ state.currentId = next.id; state.tab = next.group==='main' ? 'toc':'appendix'; render(); } };
}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  renderTOC();
  renderContent();
}

document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>{ state.tab = b.dataset.tab; renderTOC(); });
});
el.tocSearch.addEventListener('input', e=>{ state.query = e.target.value; renderTOC(); });

document.querySelectorAll('.theme-dot').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.theme = b.dataset.t;
    document.documentElement.setAttribute('data-theme', state.theme);
    localStorage.setItem('smTheme', state.theme);
    document.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active', x===b));
  });
});
document.querySelectorAll('.font-btn').forEach(b=>{
  b.addEventListener('click', ()=>{
    state.step = parseInt(b.dataset.step,10);
    document.documentElement.style.setProperty('--step', state.step);
    localStorage.setItem('smStep', state.step);
    document.querySelectorAll('.font-btn').forEach(x=>x.classList.toggle('active', x===b));
  });
});

const menuBtn = document.getElementById('menuBtn');
const sidebarClose = document.getElementById('sidebarClose');
function openSidebarMobile(){ el.sidebar.classList.add('open'); el.scrim.classList.add('show'); }
function closeSidebarMobile(){ el.sidebar.classList.remove('open'); el.scrim.classList.remove('show'); }
menuBtn.addEventListener('click', openSidebarMobile);
sidebarClose.addEventListener('click', closeSidebarMobile);
el.scrim.addEventListener('click', closeSidebarMobile);

document.documentElement.setAttribute('data-theme', state.theme);
document.documentElement.style.setProperty('--step', state.step);
document.querySelectorAll('.theme-dot').forEach(x=>x.classList.toggle('active', x.dataset.t===state.theme));
document.querySelectorAll('.font-btn').forEach(x=>x.classList.toggle('active', parseInt(x.dataset.step,10)===state.step));

render();
</script>
</body>
</html>
